# Add these blocks INSIDE your existing `server { ... }` for influencersfeed.com (the one that already serves /var/www/influencersfeed.com/dist).
# Then run:  nginx -t && systemctl reload nginx

client_max_body_size 12m;

# The API
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
}

# Live notifications and support chat
location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# The app itself (this probably exists already). Every unknown path opens the app so page refreshes work.
location / {
    root /var/www/influencersfeed.com/dist;
    try_files $uri $uri/ /index.html;
}
