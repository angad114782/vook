openapi: 3.1.0
info:
  title: Vook Frontend API
  version: 2.0.0
  description: Resource-oriented contract consumed by the standalone Vook frontend.
servers: [{ url: /api/v2 }]
security: [{ sessionCookie: [] }]
paths:
  /demo/accounts:
    get:
      operationId: listDemoAccounts
      security: []
      x-mock-only: true
      description: Development-only role cards. API mode never calls this operation.
      responses: { '200': { $ref: '#/components/responses/Object' } }
  /demo/reset:
    post:
      operationId: resetDemoData
      security: []
      x-mock-only: true
      description: Development-only reset of the browser's persistent mock graph. API mode never calls this operation.
      responses: { '200': { $ref: '#/components/responses/Object' } }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Session' }, '401': { $ref: '#/components/responses/Error' } }
  /auth/session:
    get: { operationId: getSession, responses: { '200': { $ref: '#/components/responses/Session' }, '401': { $ref: '#/components/responses/Error' } } }
    patch: { operationId: updateProfile, requestBody: { $ref: '#/components/requestBodies/Object' }, responses: { '200': { $ref: '#/components/responses/Object' } } }
  /auth/refresh:
    post: { operationId: refreshSession, responses: { '200': { $ref: '#/components/responses/Object' }, '401': { $ref: '#/components/responses/Error' } } }
  /auth/logout:
    post: { operationId: logout, responses: { '200': { $ref: '#/components/responses/Empty' } } }
