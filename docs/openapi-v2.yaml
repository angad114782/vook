  /search:
    get: { operationId: search, parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2 }}], responses: { '200': { $ref: '#/components/responses/Object' } } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: vook_session }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 } }
  requestBodies:
    Object: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    Multipart: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } }, required: [file] } } } }
  responses:
    Empty: { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyEnvelope' } } } }
    Object: { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/ObjectEnvelope' } } } }
    Company: { description: Company, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Company' } } } } } }
    Employee: { description: Employee, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Employee' } } } } } }
    Session: { description: Session, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/Session' } } } } } }
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    Binary: { description: Download, headers: { Content-Disposition: { schema: { type: string } } }, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, minLength: 8 }, otp: { type: string, pattern: '^[0-9]{6}$' } }
    CompanySummary:
      type: object
      required: [id, name, companyCode]
      properties: { id: { type: string }, name: { type: string }, companyCode: { type: string } }
    User:
      type: object
      required: [id, name, email, role]
      properties: { id: { type: string }, name: { type: string }, email: { type: string, format: email }, role: { type: string, enum: [SUPER_ADMIN, COMPANY_ADMIN, HR, FINANCE, MANAGER, SUPERVISOR, EMPLOYEE] }, company: { oneOf: [{ $ref: '#/components/schemas/CompanySummary' }, { type: 'null' }] } }
    Company:
      type: object
      required: [id, companyCode, name, plan, status]
      properties: { id: { type: string }, companyCode: { type: string }, name: { type: string }, industry: { type: string }, plan: { type: string }, status: { type: string }, maxUsers: { type: integer }, userCount: { type: integer }, createdAt: { type: string, format: date-time } }
    Employee:
      type: object
      required: [id, employeeId, status, user]
      properties: { id: { type: string }, employeeId: { type: string }, department: { type: [string, 'null'] }, designation: { type: [string, 'null'] }, status: { type: string }, user: { $ref: '#/components/schemas/User' } }
    Session:
      type: object
      required: [user, csrfToken]
      properties: { user: { $ref: '#/components/schemas/User' }, csrfToken: { type: string } }
    ListMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties: { page: { type: integer, minimum: 1 }, pageSize: { type: integer, minimum: 1 }, total: { type: integer, minimum: 0 }, totalPages: { type: integer, minimum: 0 } }
    Money:
      type: object
      required: [amountMinor, currency]
      properties: { amountMinor: { type: integer }, currency: { type: string, pattern: '^[A-Z]{3}$' } }
    PlanDraft:
      type: object
      required: [name, code, pricing, trial, moduleIds, limits, features]
      properties:
        name: { type: string }
        code: { type: string }
        pricing: { type: object, required: [currency, monthlyMinor, annualMinor], properties: { currency: { type: string }, monthlyMinor: { type: integer }, annualMinor: { type: integer } } }
        trial: { type: object, required: [enabled, days], properties: { enabled: { type: boolean }, days: { type: integer, minimum: 0 } } }
        moduleIds: { type: array, items: { type: string } }
        limits: { $ref: '#/components/schemas/EntitlementLimits' }
        features: { type: array, items: { type: string } }
    Plan:
      allOf:
        - { $ref: '#/components/schemas/PlanDraft' }
        - { type: object, required: [id, status, versionCount], properties: { id: { type: string }, status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }, currentVersionId: { type: [string, 'null'] }, versionCount: { type: integer } } }
    PlanVersion:
      allOf:
        - { $ref: '#/components/schemas/PlanDraft' }
        - { type: object, required: [id, planId, version, publishedAt], properties: { id: { type: string }, planId: { type: string }, version: { type: integer }, publishedAt: { type: string, format: date-time }, publishedBy: { type: string } } }
    EntitlementLimits:
      type: object
      required: [employees, storageGB, apiRequests]
      properties: { employees: { type: integer, minimum: 0 }, storageGB: { type: integer, minimum: 0 }, apiRequests: { type: integer, minimum: 0 } }
    EntitlementOverride:
      type: object
      required: [id, companyId, effect, reason, createdAt]
      properties:
        id: { type: string }
        companyId: { type: string }
        moduleId: { type: string }
        limitKey: { type: string, enum: [employees, storageGB, apiRequests] }
        effect: { type: string, enum: [GRANT, DENY, SET_LIMIT] }
        oldValue: {}
        newValue: {}
        limitValue: { type: integer }
        reason: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    EntitlementSnapshot:
      type: object
      required: [plan, modules, limits, overrides]
      properties:
        plan: { type: object, additionalProperties: true }
        modules: { type: array, items: { type: object, required: [id, key, name, isEnabled, source], properties: { id: { type: string }, key: { type: string }, name: { type: string }, isEnabled: { type: boolean }, source: { type: string, enum: [PLAN, OVERRIDE_GRANT, OVERRIDE_DENY, NOT_INCLUDED] } } } }
        limits: { $ref: '#/components/schemas/EntitlementLimits' }
        overrides: { type: array, items: { $ref: '#/components/schemas/EntitlementOverride' } }
    Subscription:
      type: object
      required: [id, companyId, planId, planVersionId, status, billingCycle, startDate]
      properties:
        id: { type: string }
        companyId: { type: string }
        planId: { type: string }
        planVersionId: { type: string }
        status: { type: string, enum: [TRIAL, ACTIVE, PAST_DUE, SUSPENDED, CANCELLED] }
        billingCycle: { type: string, enum: [MONTHLY, ANNUAL] }
        startDate: { type: string, format: date-time }
        trialEndsAt: { type: [string, 'null'], format: date-time }
        currentPeriodEnd: { type: [string, 'null'], format: date-time }
        graceEndsAt: { type: [string, 'null'], format: date-time }
    Department:
      type: object
      required: [id, companyId, name, code]
      properties: { id: { type: string }, companyId: { type: string }, name: { type: string }, code: { type: string }, isActive: { type: boolean } }
    Team:
      type: object
      required: [id, companyId, name]
      properties: { id: { type: string }, companyId: { type: string }, name: { type: string }, departmentId: { type: string }, managerEmployeeId: { type: string }, supervisorEmployeeId: { type: string }, employeeIds: { type: array, items: { type: string } } }
    ReportingLine:
      type: object
      required: [id, companyId, employeeId]
      properties: { id: { type: string }, companyId: { type: string }, employeeId: { type: string }, managerEmployeeId: { type: [string, 'null'] }, supervisorEmployeeId: { type: [string, 'null'] }, effectiveFrom: { type: string, format: date } }
    PermissionGrant:
      type: object
      required: [module, action]
      properties: { module: { type: string }, action: { type: string, enum: [VIEW, CREATE, EDIT, DELETE, APPROVE, REJECT, EXPORT, OVERRIDE, PROCESS, FINALIZE, PUBLISH, CONFIGURE] } }
    RoleDefinition:
      type: object
      required: [id, companyId, key, name, kind, locked, permissions, revision]
      properties: { id: { type: string }, companyId: { type: string }, key: { type: string }, name: { type: string }, kind: { type: string, enum: [SYSTEM, TEMPLATE, CUSTOM] }, locked: { type: boolean }, permissions: { type: array, items: { type: string } }, revision: { type: integer } }
    RoleAssignment:
      type: object
      required: [id, companyId, userId, roleDefinitionId, scopeType]
      properties: { id: { type: string }, companyId: { type: string }, userId: { type: string }, roleDefinitionId: { type: string }, scopeType: { type: string, enum: [COMPANY, DEPARTMENT, TEAM, SELF] }, scopeId: { type: [string, 'null'] }, isPrimary: { type: boolean } }
    AccessSnapshot:
      type: object
      required: [role, permissions, modules, roles, subscription]
      properties: { role: { type: string }, permissions: { type: array, items: { type: string } }, modules: { type: array, items: { type: object, additionalProperties: true } }, roles: { type: array, items: { type: object, additionalProperties: true } }, subscription: { oneOf: [{ $ref: '#/components/schemas/Subscription' }, { type: 'null' }] } }
    AttendanceEvent:
      type: object
      required: [id, employeeId, source, eventType, occurredAt]
      properties: { id: { type: string }, employeeId: { type: string }, source: { type: string, enum: [WEB, MOBILE, MANUAL, CSV, API, BIOMETRIC] }, eventType: { type: string, enum: [CHECK_IN, CHECK_OUT] }, occurredAt: { type: string, format: date-time }, latitude: { type: number }, longitude: { type: number }, suspicious: { type: boolean } }
    ApprovalDecision:
      type: object
      required: [actorId, action, createdAt]
      properties: { actorId: { type: string }, action: { type: string, enum: [RECOMMEND, APPROVE, REJECT, COMPLETE] }, comment: { type: string }, createdAt: { type: string, format: date-time } }
    SalaryVersion:
      type: object
      required: [id, employeeId, effectiveFrom, annualCtcMinor, currency]
      properties: { id: { type: string }, employeeId: { type: string }, effectiveFrom: { type: string, format: date }, effectiveTo: { type: [string, 'null'], format: date }, annualCtcMinor: { type: integer }, currency: { type: string } }
    PayrollRun:
      type: object
      required: [id, companyId, month, year, status, totalNetMinor, currency]
      properties: { id: { type: string }, companyId: { type: string }, month: { type: integer }, year: { type: integer }, status: { type: string, enum: [DRAFT, CALCULATED, UNDER_REVIEW, APPROVED, FINALIZED, PUBLISHED] }, totalNetMinor: { type: integer }, currency: { type: string }, finalizedAt: { type: [string, 'null'], format: date-time }, publishedAt: { type: [string, 'null'], format: date-time } }
    Payment:
      type: object
      required: [id, companyId, provider, status, amount]
      properties: { id: { type: string }, companyId: { type: string }, provider: { type: string, enum: [RAZORPAY, PAYU, OFFLINE] }, status: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }, amount: { $ref: '#/components/schemas/Money' }, idempotencyKey: { type: string }, createdAt: { type: string, format: date-time } }
    Invoice:
      type: object
      required: [id, companyId, invoiceNumber, status, total]
      properties: { id: { type: string }, companyId: { type: string }, invoiceNumber: { type: string }, status: { type: string, enum: [DRAFT, ISSUED, PAID, VOID] }, total: { $ref: '#/components/schemas/Money' }, issuedAt: { type: string, format: date-time } }
    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, createdAt]
      properties: { id: { type: string }, companyId: { type: [string, 'null'] }, actorId: { type: [string, 'null'] }, action: { type: string }, entityType: { type: string }, entityId: { type: string }, oldValue: {}, newValue: {}, requestId: { type: string }, createdAt: { type: string, format: date-time } }
    ObjectEnvelope: { type: object, required: [data], properties: { data: {}, meta: { $ref: '#/components/schemas/ListMeta' } } }
    EmptyEnvelope: { type: object, required: [data], properties: { data: { type: 'null' } } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: {}, requestId: { type: string } }
